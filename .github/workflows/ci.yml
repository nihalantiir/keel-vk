name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }}, ImGui=${{ matrix.imgui }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        imgui: [ON, OFF]

    steps:
      - uses: actions/checkout@v4

      # Only Vulkan core (headers, loader, validation layers, glslc) is
      # needed from the SDK itself in CI. SDL3/volk/VMA/GLM are provided by
      # vcpkg below: the SDK's unattended installer doesn't reliably offer
      # all four as installable components across platforms, unlike the
      # interactive Windows installer used for local development, which
      # bundles them unconditionally.
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: latest
          cache: true

      # Linux only: volk.h unconditionally pulls in the XCB platform
      # headers when compiling on Linux, regardless of which WSI backend
      # SDL3 actually ends up using at runtime.
      - name: Install XCB headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libx11-dev libwayland-dev

      # vcpkg's volk/vulkan-memory-allocator/glm ports produce CMake
      # packages with the exact target names (volk::volk,
      # GPUOpen::VulkanMemoryAllocator, glm::glm) CMakeLists.txt already
      # looks for via find_package(... CONFIG), so no project-side changes
      # are needed. sdl3[core] skips SDL3's optional Linux backends, which
      # pull in build tools this runner doesn't have and a compile-only
      # check doesn't need anyway.
      #
      # The install prefix is captured into KEEL_VK_VCPKG_PREFIX (not
      # VCPKG_ROOT) because ilammy/msvc-dev-cmd, which runs after this step
      # on Windows, overwrites VCPKG_ROOT with Visual Studio's own bundled
      # (and here, unused) vcpkg instance.
      - name: Install SDL3 + volk + VMA + GLM (vcpkg)
        shell: bash
        run: |
          VCPKG_ROOT="${VCPKG_INSTALLATION_ROOT:-$VCPKG_ROOT}"
          "$VCPKG_ROOT/vcpkg" install "sdl3[core]" volk vulkan-memory-allocator glm

          TRIPLET=x64-windows
          [ "$RUNNER_OS" = "Linux" ] && TRIPLET=x64-linux
          echo "KEEL_VK_VCPKG_PREFIX=$VCPKG_ROOT/installed/$TRIPLET" >> "$GITHUB_ENV"

      - name: Set up MSVC Developer Command Prompt
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      # Compile-only: no GPU is available on hosted runners, so this
      # verifies the project configures and builds, not that it runs.
      - name: Configure
        shell: bash
        run: cmake --preset debug -DCMAKE_PREFIX_PATH="$KEEL_VK_VCPKG_PREFIX" -DKEEL_VK_IMGUI=${{ matrix.imgui }}

      - name: Build
        run: cmake --build --preset debug
