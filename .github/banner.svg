<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="keel-vk">
  <title>keel-vk</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1e20"/>
      <stop offset="60%" stop-color="#232325"/>
      <stop offset="100%" stop-color="#28282b"/>
    </linearGradient>
    <linearGradient id="front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7373"/>
      <stop offset="100%" stop-color="#e62e2e"/>
    </linearGradient>
    <linearGradient id="left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73ffff"/>
      <stop offset="100%" stop-color="#2ee6e6"/>
    </linearGradient>
    <linearGradient id="top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7373ff"/>
      <stop offset="100%" stop-color="#2e2ee6"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- Perspective cube, same camera sense and per-face hue mapping as the
       renderer (front=0deg, left=180deg, top=240deg), one static rotation. -->
  <polygon points="935.4,280.1 1073.4,263.1 1114.3,108.4 971.4,99.1" fill="url(#front)"/>
  <polygon points="860.8,205.8 884.6,54.8 971.4,99.1 935.4,280.1" fill="url(#left)"/>
  <polygon points="884.6,54.8 1014.1,68.1 1114.3,108.4 971.4,99.1" fill="url(#top)"/>

  <text x="60" y="188" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="56" font-weight="600" letter-spacing="1" fill="#e7e7ea">Keel</text>
</svg>
